<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semesterplaneraren</title>

    <!-- 📅 FullCalendar -->
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>

    <!-- 🎨 CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- 🔝 TOPBAR -->
<header class="topbar">
    <div class="topbar-left">
        📅 <span>Semesterplanerare</span>
    </div>

    <div class="topbar-center" id="calendarControls"></div>

    <div class="topbar-right">
        <button class="primary-btn" onclick="openModal('vacationModal')">
            + Ny semester
        </button>

        <div class="user-box">
            <span id="currentUserName">Användare</span>
        </div>

        <button class="logout-btn" onclick="logout()">
            Logga ut
        </button>
    </div>
</header>

<!-- 🎯 ACTIONS -->
<section class="actions">
    <div class="action-card" onclick="openModal('employeeModal')">
        👥 Lägg till personal
    </div>

    <div class="action-card" onclick="openModal('vacationModal')">
        📅 Lägg till semester
    </div>

    <div class="action-card" onclick="openModal('filterModal')">
        🔍 Filter
    </div>

    <div class="action-card" onclick="openModal('groupModal')">
        🧩 Skapa grupp
    </div>
</section>

<!-- 📅 KALENDER -->
<main>
    <div id="calendar"></div>
</main>

<!-- 📋 LISTA -->
<section class="card">
    <h3>📋 Semesterlista</h3>
    <ul id="vacationList"></ul>
</section>

<!-- 🪟 MODAL OVERLAY -->
<div id="modalOverlay" class="modal-overlay"></div>

<!-- 👤 PERSONAL -->
<div id="employeeModal" class="modal">
    <div class="modal-content">
        <button class="close" onclick="closeModal('employeeModal')">×</button>
        <h3>Lägg till personal</h3>

        <p id="employeeWarning" class="warning"></p>

        <input type="text" id="employeeName" placeholder="Namn">
        <select id="employeeGroupSelect"></select>

        <!-- 🔥 NYTT -->
        <input type="number" id="employeeVacationDays" placeholder="Semesterdagar (ex: 25)" min="1">

        <button class="primary-btn" onclick="tryAddEmployee()">Spara</button>

        <ul id="employeeList" class="list"></ul>
    </div>
</div>

<!-- ✏️ EDIT EMPLOYEE -->
<div id="editEmployeeModal" class="modal">
    <div class="modal-content">
        <button class="close" onclick="closeModal('editEmployeeModal')">×</button>
        <h3>Redigera personal</h3>

        <input type="hidden" id="editEmployeeId">

        <input type="text" id="editEmployeeName" placeholder="Namn">

        <!-- 🔥 NYTT -->
        <input type="number" id="editEmployeeVacationDays" placeholder="Semesterdagar" min="1">

        <!-- 🔥 BALANS -->
        <div id="employeeBalanceBox" style="font-size:13px; color:#6b7280;">
            📊 Laddar balans...
        </div>

        <button class="primary-btn" onclick="saveEmployeeEdit()">Spara</button>
        <button class="logout-btn" onclick="deleteEmployee()">Ta bort</button>
    </div>
</div>

<!-- 📅 ADD VACATION -->
<div id="vacationModal" class="modal">
    <div class="modal-content">
        <button class="close" onclick="closeModal('vacationModal')">×</button>
        <h3>Lägg till semester</h3>

        <input type="text" id="employeeSearch" placeholder="Sök person...">
        <select id="employeeSelect"></select>

        <!-- 🔥 BALANS LIVE -->
        <div id="vacationBalanceInfo" style="font-size:13px; color:#6b7280;"></div>

        <label>Start</label>
        <input type="date" id="startDate">

        <label>Slut</label>
        <input type="date" id="endDate">

        <button class="primary-btn" onclick="trySubmitVacation()">Spara</button>

        <p id="warning" class="warning"></p>
    </div>
</div>

<!-- ✏️ EDIT VACATION -->
<div id="editVacationModal" class="modal">
    <div class="modal-content">
        <button class="close" onclick="closeModal('editVacationModal')">×</button>

        <h3>Redigera semester</h3>

        <input type="hidden" id="editVacationId">

        <label>Start</label>
        <input type="date" id="editStartDate">

        <label>Slut</label>
        <input type="date" id="editEndDate">

        <button class="primary-btn" onclick="updateVacation()">💾 Spara</button>

        <button class="logout-btn" onclick="deleteVacationFromModal()">🗑 Ta bort</button>

        <button onclick="closeModal('editVacationModal')">Stäng</button>
    </div>
</div>

<!-- 🔍 FILTER -->
<div id="filterModal" class="modal">
    <div class="modal-content">
        <button class="close" onclick="closeModal('filterModal')">×</button>
        <h3>Filter</h3>

        <select id="filter" onchange="refreshCalendar(); closeModal('filterModal');">
            <option value="all">Visa alla</option>
        </select>
    </div>
</div>

<!-- 🧩 GROUP -->
<div id="groupModal" class="modal">
    <div class="modal-content">
        <button class="close" onclick="closeModal('groupModal')">×</button>
        <h3>Skapa grupp</h3>

        <input type="text" id="groupName" placeholder="Gruppnamn">
        <input type="color" id="groupColor" value="#3b82f6">
        <input type="number" id="groupLimit" placeholder="Max samtidiga" min="1">

        <button class="primary-btn" onclick="tryAddGroup()">Spara</button>

        <p id="groupWarning" class="warning"></p>
    </div>
</div>

<!-- 📦 SCRIPTS -->
<script src="data.js"></script>
<script src="auth.js"></script>
<script src="ui.js"></script>
<script src="groups.js"></script>
<script src="employees.js"></script>
<script src="vacations.js"></script>

<!-- 🔥 CALENDAR CORE -->
<script src="calendar/calendar-events.js"></script>
<script src="calendar/calendar-actions.js"></script>
<script src="calendar/calendar-init.js"></script>

<script src="app.js"></script>

<!-- 🧠 INIT -->
<script>
document.addEventListener("DOMContentLoaded", () => {
    try {
        const user = localStorage.getItem("currentUser");
        const el = document.getElementById("currentUserName");
        if (el && user) el.innerText = user;

        if (typeof initCalendar === "function") {
            initCalendar();
        }

    } catch (err) {
        console.error("Init error:", err);
    }
});
</script>

</body>
</html>
