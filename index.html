<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semesterplaneraren</title>

    <!-- 📅 FullCalendar -->
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>

    <!-- 🎨 CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- ========================================== -->
<!-- 🔝 TOPBAR -->
<!-- ========================================== -->

<header class="topbar">

    <div class="topbar-left">
        📅 <span>Semesterplanerare</span>
    </div>

    <div class="topbar-center" id="calendarControls"></div>

    <div class="topbar-right">

        <button class="primary-btn" onclick="openModal('vacationModal')">
            + Ny semester
        </button>

        <div class="user-box">
            <span id="currentUserName">Användare</span>
        </div>

        <button class="logout-btn" onclick="logout()">
            Logga ut
        </button>

    </div>

</header>

<!-- ========================================== -->
<!-- 🎯 ACTIONS -->
<!-- ========================================== -->

<section class="actions">

    <div class="action-card" onclick="openModal('employeeModal')">
        👥 Lägg till personal
    </div>

    <div class="action-card" onclick="openModal('vacationModal')">
        📅 Lägg till semester
    </div>

    <div class="action-card" onclick="openModal('filterModal')">
        🔍 Filter
    </div>

</section>

<!-- ========================================== -->
<!-- 📅 KALENDER -->
<!-- ========================================== -->

<main>
    <div id="calendar"></div>
</main>

<!-- ========================================== -->
<!-- 📋 LISTA -->
<!-- ========================================== -->

<section class="card">
    <h3>📋 Semesterlista</h3>
    <ul id="vacationList"></ul>
</section>

<!-- ========================================== -->
<!-- 🪟 MODALS -->
<!-- ========================================== -->

<div id="modalOverlay" class="modal-overlay" onclick="closeModal()"></div>

<!-- 👥 PERSONAL -->
<div id="employeeModal" class="modal">
    <div class="modal-content">

        <button class="close" onclick="closeModal()">×</button>

        <h3>Lägg till personal</h3>

        <input type="text" id="employeeName" placeholder="Namn">

        <button class="primary-btn" onclick="addEmployee(); closeModal();">
            Spara
        </button>

    </div>
</div>

<!-- 📅 SEMESTER -->
<div id="vacationModal" class="modal">
    <div class="modal-content">

        <button class="close" onclick="closeModal()">×</button>

        <h3>Lägg till semester</h3>

        <select id="employeeSelect"></select>

       <input type="text" id="startDate" placeholder="YYYY-MM-DD">
       <input type="text" id="endDate" placeholder="YYYY-MM-DD"> 

        <button class="primary-btn" onclick="addVacation(); closeModal();">
            Spara
        </button>

        <p id="warning"></p>

    </div>
</div>

<!-- 🔍 FILTER -->
<div id="filterModal" class="modal">
    <div class="modal-content">

        <button class="close" onclick="closeModal()">×</button>

        <h3>Filter</h3>

        <!-- ❗ OBS: renderCalendar bort -->
        <select id="filter" onchange="refreshCalendar(); closeModal();">
            <option value="all">Visa alla</option>
        </select>

    </div>
</div>

<!-- ========================================== -->
<!-- 📦 SCRIPTS (KRITISK ORDNING) -->
<!-- ========================================== -->

<!-- 🔹 CORE -->
<script src="data.js"></script>
<script src="auth.js"></script>
<script src="ui.js"></script>

<!-- 🔹 DATA LAYER -->
<script src="employees.js"></script>
<script src="vacations.js"></script>

<!-- 🔥 DEBUG (valfri men rekommenderad just nu) -->
<script>
    console.log("CORE + DATA loaded");
</script>

<!-- 🔥 FULLCALENDAR (MÅSTE KOMMA EFTER DATA) -->
<script src="calendar/calendar-events.js"></script>
<script src="calendar/calendar-init.js"></script>

<!-- 🔥 DEBUG -->
<script>
    console.log("Calendar modules loaded");
</script>

<!-- ❌ GAMMAL (ska EJ användas) -->
<!-- <script src="calendar.js"></script> -->

<!-- 🔹 APP INIT (ALLTID SIST) -->
<script src="app.js"></script>

<!-- 🔥 DEBUG -->
<script>
    console.log("App loaded");
</script>
<!-- ========================================== -->
<!-- 🧠 USER NAME INIT -->
<!-- ========================================== -->

<script>
document.addEventListener("DOMContentLoaded", () => {
    const user = localStorage.getItem("currentUser");
    const el = document.getElementById("currentUserName");

    if (el && user) {
        el.innerText = user;
    }
});
</script>

</body>
</html>
