<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <title>Semesterplanering</title>

    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>📅 Semesterplanering</h1>

<div class="card">
    <h3>👥 Personal</h3>
    <input type="text" id="employeeName" placeholder="Namn">
    <button onclick="addEmployee()">Lägg till</button>

    <ul id="employeeList"></ul>
</div>

<div class="card">
    <h3>📅 Lägg till semester</h3>

    <select id="employeeSelect"></select>
    <input type="date" id="startDate">
    <input type="date" id="endDate">

    <button onclick="addVacation()">Spara</button>

    <p id="warning"></p>
</div>

<div class="card">
    <h3>🔍 Filter</h3>
    <select id="filter" onchange="renderCalendar()">
        <option value="all">Visa alla</option>
    </select>
</div>

<div id="calendar"></div>

<div class="card">
    <h3>📋 Semesterlista</h3>
    <ul id="vacationList"></ul>
</div>

<script src="app.js"></script>

</body>
</html>
