<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semesterplaneraren</title>

    <!-- 📅 FullCalendar -->
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js" defer></script>

    <!-- 🎨 CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- 🧠 CORE -->
    <script src="utils/dom.js" defer></script>
    <script src="core/state.js" defer></script>
</head>

<body>

<!-- 🔝 TOPBAR -->
<header class="topbar">
    <div class="topbar-left">
        📅 <span>Semesterplanerare</span>
    </div>

    <div class="topbar-center" id="calendarControls"></div>

    <div class="topbar-right">
        <button class="primary-btn" id="btnAddVacation">
            + Ny semester
        </button>

        <div class="user-box">
            <span id="currentUserName">Användare</span>
        </div>

        <button class="logout-btn" id="btnLogout">
            Logga ut
        </button>
    </div>
</header>

<!-- 🎯 ACTIONS -->
<section class="actions">
    <div class="action-card" data-action="employee">
        👥 Lägg till personal
    </div>

    <div class="action-card" data-action="vacation">
        📅 Lägg till semester
    </div>

    <div class="action-card" data-action="filter">
        🔍 Filter
    </div>

    <div class="action-card" data-action="group">
        🧩 Skapa grupp
    </div>
</section>

<!-- 📅 KALENDER -->
<main>
    <div id="calendar"></div>
</main>

<!-- 📋 LISTA -->
<section class="card">
    <h3 id="vacationListTitle">📋 Semesterlista</h3>

    <div id="vacationSummary" class="muted-text"></div>

    <ul id="vacationList"></ul>
</section>

<!-- 🪟 MODAL OVERLAY -->
<div id="modalOverlay" class="modal-overlay"></div>

<!-- 👤 PERSONAL -->
<div id="employeeModal" class="modal">
    <div class="modal-content">
        <button class="close" data-close="employeeModal">×</button>

        <h3>Lägg till personal</h3>

        <p id="employeeWarning" class="warning"></p>

        <input type="text" id="employeeName" placeholder="Namn" autocomplete="off">
        <select id="employeeGroupSelect"></select>
        <input type="number" id="employeeVacationDays" placeholder="Semesterdagar" min="1">

        <button class="primary-btn" id="saveEmployeeBtn">Spara</button>

        <ul id="employeeList" class="list"></ul>
    </div>
</div>

<!-- ✏️ EDIT EMPLOYEE -->
<div id="editEmployeeModal" class="modal">
    <div class="modal-content">
        <button class="close" data-close="editEmployeeModal">×</button>

        <h3>Redigera personal</h3>

        <input type="hidden" id="editEmployeeId">
        <input type="text" id="editEmployeeName">
        <input type="number" id="editEmployeeVacationDays">

        <div id="employeeBalanceBox" class="muted-text"></div>

        <button class="primary-btn" id="updateEmployeeBtn">Spara</button>
        <button class="logout-btn" id="deleteEmployeeBtn">Ta bort</button>
    </div>
</div>

<!-- 📅 ADD VACATION -->
<div id="vacationModal" class="modal">
    <div class="modal-content">
        <button class="close" data-close="vacationModal">×</button>

        <h3>Lägg till semester</h3>

        <input type="text" id="employeeSearch" placeholder="Sök person..." autocomplete="off">
        <select id="employeeSelect"></select>

        <div id="vacationBalanceInfo" class="muted-text"></div>

        <label>Start</label>
        <input type="date" id="startDate">

        <label>Slut</label>
        <input type="date" id="endDate">

        <button class="primary-btn" id="saveVacationBtn">Spara</button>

        <p id="warning" class="warning"></p>
    </div>
</div>

<!-- 📦 SCRIPTS -->
<script src="data.js" defer></script>
<script src="auth.js" defer></script>
<script src="ui.js" defer></script>
<script src="groups.js" defer></script>
<script src="employees.js" defer></script>
<script src="vacations.js" defer></script>

<script src="calendar/calendar-events.js" defer></script>
<script src="calendar/calendar-actions.js" defer></script>
<script src="calendar/calendar-init.js" defer></script>

<script src="app.js" defer></script>

<!-- 🧠 INIT -->
<script>
document.addEventListener("DOMContentLoaded", () => {
    try {
        // 🔥 LOAD STATE (NYTT)
        window.AppState?.load();

        // 👤 USER
        const user = localStorage.getItem("currentUser");
        UI?.text("currentUserName", user || "Användare");

        // 🔘 BUTTONS
        UI.get("btnAddVacation")?.addEventListener("click", () => openModal("vacationModal"));
        UI.get("btnLogout")?.addEventListener("click", logout);

        // 🎯 ACTION CARDS
        document.querySelectorAll("[data-action]").forEach(el => {
            el.addEventListener("click", () => {
                const map = {
                    employee: "employeeModal",
                    vacation: "vacationModal",
                    filter: "filterModal",
                    group: "groupModal"
                };
                openModal(map[el.dataset.action]);
            });
        });

        // ❌ CLOSE BUTTONS (🔥 generisk)
        document.querySelectorAll("[data-close]").forEach(btn => {
            btn.addEventListener("click", () => {
                closeModal(btn.dataset.close);
            });
        });

        // 📋 LIST CLICK
        UI.get("vacationListTitle")?.addEventListener("click", () => {
            window.openVacationOverview?.();
        });

        // 🔍 FILTER
        UI.get("filter")?.addEventListener("change", () => {
            refreshCalendar?.();
            closeModal?.("filterModal");
        });

        // 🚀 INIT CALENDAR
        requestAnimationFrame(() => {
            initCalendar?.();
        });

    } catch (err) {
        console.error("Init error:", err);
    }
});
</script>

</body>
</html>
