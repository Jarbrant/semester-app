<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semesterplaneraren</title>

    <!-- 📅 FullCalendar -->
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>

    <!-- 🎨 CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- 🔝 TOPBAR -->
<header class="topbar">
    <div class="topbar-left">
        📅 <span>Semesterplanerare</span>
    </div>

    <div class="topbar-center" id="calendarControls"></div>

    <div class="topbar-right">
        <button class="primary-btn" onclick="openModal('vacationModal')">
            + Ny semester
        </button>

        <div class="user-box">
            <span id="currentUserName">Användare</span>
        </div>

        <button class="logout-btn" onclick="logout()">
            Logga ut
        </button>
    </div>
</header>

<!-- 🎯 ACTIONS -->
<section class="actions">
    <div class="action-card" onclick="openModal('employeeModal')">
        👥 Lägg till personal
    </div>

    <div class="action-card" onclick="openModal('vacationModal')">
        📅 Lägg till semester
    </div>

    <div class="action-card" onclick="openModal('filterModal')">
        🔍 Filter
    </div>

    <div class="action-card" onclick="openModal('groupModal')">
        🧩 Skapa grupp
    </div>
</section>

<!-- 📅 KALENDER -->
<main>
    <div id="calendar"></div>
</main>

<!-- 📋 LISTA -->
<section class="card">
    <h3>📋 Semesterlista</h3>
    <ul id="vacationList"></ul>
</section>

<!-- 🪟 MODALS -->
<div id="modalOverlay" class="modal-overlay"></div>

<!-- 👤 PERSONAL -->
<div id="employeeModal" class="modal">
    <div class="modal-content">
        <button class="close" onclick="closeModal()">×</button>
        <h3>Lägg till personal</h3>

        <p id="employeeWarning" style="color:#e11d48"></p>

        <input type="text" id="employeeName" placeholder="Namn">
        <select id="employeeGroupSelect"></select>

        <button class="primary-btn" onclick="tryAddEmployee()">Spara</button>

        <!-- 🔥 NY: LISTA -->
        <ul id="employeeList" style="margin-top:10px;"></ul>
    </div>
</div>

<!-- ✏️ EDIT EMPLOYEE -->
<div id="editEmployeeModal" class="modal">
    <div class="modal-content">
        <button class="close" onclick="closeModal()">×</button>
        <h3>Redigera personal</h3>

        <input type="hidden" id="editEmployeeId">

        <input type="text" id="editEmployeeName" placeholder="Namn">

        <button class="primary-btn" onclick="saveEmployeeEdit()">Spara</button>
        <button class="logout-btn" onclick="deleteEmployee()">Ta bort</button>
    </div>
</div>

<!-- 📅 SEMESTER -->
<div id="vacationModal" class="modal">
    <div class="modal-content">
        <button class="close" onclick="closeModal()">×</button>
        <h3>Lägg till semester</h3>

        <!-- 🔍 SEARCH -->
        <input type="text" id="employeeSearch" placeholder="Sök person...">

        <select id="employeeSelect"></select>

        <input type="date" id="startDate">
        <input type="date" id="endDate">

        <button class="primary-btn" onclick="trySubmitVacation()">Spara</button>

        <p id="warning" style="color:#e11d48"></p>
    </div>
</div>

<!-- 🔍 FILTER -->
<div id="filterModal" class="modal">
    <div class="modal-content">
        <button class="close" onclick="closeModal()">×</button>
        <h3>Filter</h3>

        <select id="filter" onchange="refreshCalendar(); closeModal();">
            <option value="all">Visa alla</option>
        </select>
    </div>
</div>

<!-- 🧩 GROUP MODAL -->
<div id="groupModal" class="modal">
    <div class="modal-content">
        <button class="close" onclick="closeModal()">×</button>
        <h3>Skapa grupp</h3>

        <input type="text" id="groupName" placeholder="Gruppnamn">
        <input type="color" id="groupColor" value="#3b82f6">
        <input type="number" id="groupLimit" placeholder="Max samtidiga" min="1">

        <button class="primary-btn" onclick="tryAddGroup()">Spara</button>

        <p id="groupWarning" style="color:#e11d48"></p>
    </div>
</div>

<!-- 📦 SCRIPTS (KRITISK ORDNING) -->

<script src="data.js"></script>
<script src="auth.js"></script>
<script src="ui.js"></script>
<script src="groups.js"></script>
<script src="employees.js"></script>
<script src="vacations.js"></script>

<script src="calendar/calendar-events.js"></script>
<script src="calendar/calendar-init.js"></script>

<script src="app.js"></script>

<!-- 🧠 USER INIT -->
<script>
document.addEventListener("DOMContentLoaded", () => {
    const user = localStorage.getItem("currentUser");
    const el = document.getElementById("currentUserName");
    if (el && user) el.innerText = user;
});
</script>

</body>
</html>
