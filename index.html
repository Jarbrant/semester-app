<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semesterplaneraren</title>

    <!-- 📅 FullCalendar -->
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js" defer></script>

    <!-- 🎨 CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- 🧠 CORE -->
    <script src="utils/dom.js" defer></script>
    <script src="core/state.js" defer></script>
</head>

<body>

<!-- 🔝 TOPBAR -->
<header class="topbar">
    <div class="topbar-left">
        📅 <span>Semesterplanerare</span>
    </div>

    <div class="topbar-center" id="calendarControls"></div>

    <div class="topbar-right">
        <button class="primary-btn" id="btnAddVacation">
            + Ny semester
        </button>

        <div class="user-box">
            <span id="currentUserName">Användare</span>
        </div>

        <button class="logout-btn" id="btnLogout">
            Logga ut
        </button>
    </div>
</header>

<!-- 🎯 ACTIONS -->
<section class="actions">
    <div class="action-card" data-action="employee">👥 Lägg till personal</div>
    <div class="action-card" data-action="vacation">📅 Lägg till semester</div>
    <div class="action-card" data-action="filter">🔍 Filter</div>
    <div class="action-card" data-action="group">🧩 Skapa grupp</div>
</section>

<!-- 📅 KALENDER -->
<main>
    <div id="calendar"></div>
</main>

<!-- 📋 LISTA -->
<section class="card">
    <h3 id="vacationListTitle">📋 Semesterlista</h3>
    <div id="vacationSummary" class="muted-text"></div>
    <ul id="vacationList"></ul>
</section>

<!-- 🪟 MODAL OVERLAY -->
<div id="modalOverlay" class="modal-overlay"></div>

<!-- 👤 PERSONAL -->
<div id="employeeModal" class="modal">
    <div class="modal-content">
        <button class="close" data-close="employeeModal">×</button>
        <h3>Lägg till personal</h3>
        <p id="employeeWarning" class="warning"></p>

        <input type="text" id="employeeName" placeholder="Namn">
        <select id="employeeGroupSelect"></select>
        <input type="number" id="employeeVacationDays" placeholder="Semesterdagar">

        <button class="primary-btn" id="saveEmployeeBtn">Spara</button>
        <ul id="employeeList" class="list"></ul>
    </div>
</div>

<!-- ✏️ EDIT EMPLOYEE -->
<div id="editEmployeeModal" class="modal">
    <div class="modal-content">
        <button class="close" data-close="editEmployeeModal">×</button>
        <h3>Redigera personal</h3>

        <input type="hidden" id="editEmployeeId">
        <input type="text" id="editEmployeeName">
        <input type="number" id="editEmployeeVacationDays">

        <div id="employeeBalanceBox" class="muted-text"></div>

        <button class="primary-btn" id="updateEmployeeBtn">Spara</button>
        <button class="logout-btn" id="deleteEmployeeBtn">Ta bort</button>
    </div>
</div>

<!-- 📅 VACATION -->
<div id="vacationModal" class="modal">
    <div class="modal-content">
        <button class="close" data-close="vacationModal">×</button>
        <h3>Lägg till semester</h3>

        <input type="text" id="employeeSearch" placeholder="Sök person...">
        <select id="employeeSelect"></select>

        <div id="vacationBalanceInfo"></div>

        <label>Start</label>
        <input type="date" id="startDate">

        <label>Slut</label>
        <input type="date" id="endDate">

        <button class="primary-btn" id="saveVacationBtn">Spara</button>
        <p id="warning"></p>
    </div>
</div>

<!-- 🔍 FILTER MODAL (FULL VERSION) -->
<div id="filterModal" class="modal">
    <div class="modal-content">
        <button class="close" data-close="filterModal">×</button>

        <h3>Filter</h3>

        <label>Person</label>
        <select id="filterEmployee"></select>

        <label>Grupp</label>
        <select id="filterGroup"></select>

        <label>Från</label>
        <input type="date" id="filterFrom">

        <label>Till</label>
        <input type="date" id="filterTo">

        <div style="margin-top:10px;">
            <button class="primary-btn" id="applyFilterBtn">Applicera</button>
            <button id="resetFilterBtn">Rensa</button>
        </div>
    </div>
</div>

<!-- 🧩 GROUP MODAL (PATCHED) -->
<div id="groupModal" class="modal">
    <div class="modal-content">
        <button class="close" data-close="groupModal">×</button>

        <h3>Skapa grupp</h3>

        <!-- 🧩 NAMN -->
        <input type="text" id="groupName" placeholder="Gruppnamn">

        <!-- 👥 MAX -->
        <input type="number" id="groupMax" placeholder="Max samtidiga">

        <!-- 🎨 FÄRGVAL -->
        <label style="margin-top:10px;">Färg</label>

        <div id="groupColorPicker" style="display:flex; gap:8px; flex-wrap:wrap; margin-top:8px;">
            <div class="color-dot" data-color="#3b82f6" style="background:#3b82f6"></div>
            <div class="color-dot" data-color="#ef4444" style="background:#ef4444"></div>
            <div class="color-dot" data-color="#22c55e" style="background:#22c55e"></div>
            <div class="color-dot" data-color="#f59e0b" style="background:#f59e0b"></div>
            <div class="color-dot" data-color="#8b5cf6" style="background:#8b5cf6"></div>
        </div>

        <!-- 👀 PREVIEW -->
        <div id="groupPreview" style="
            margin-top:10px;
            padding:8px;
            border-radius:8px;
            background:#3b82f6;
            color:white;
            text-align:center;
        ">
            Förhandsvisning
        </div>

        <!-- 🔥 FIX: INGEN onclick -->
        <button class="primary-btn" id="saveGroupBtn">Spara</button>
    </div>
</div>

<!-- 📦 CORE SCRIPTS -->
<script src="data.js" defer></script>
<script src="auth.js" defer></script>
<script src="ui.js" defer></script>
<script src="groups.js" defer></script>
<script src="employees.js" defer></script>
<script src="vacations.js" defer></script>

<!-- 📅 CALENDAR -->
<script src="calendar/calendar-events.js" defer></script>
<script src="calendar/calendar-actions.js" defer></script>
<script src="calendar/calendar-init.js" defer></script>

<!-- 🔥 NEW FEATURES -->
<script src="features/filter-system.js" defer></script>
<script src="features/filter-ui.js" defer></script>
<script src="features/calendar-filter-hook.js" defer></script>
<script src="features/calendar-conflicts.js" defer></script>
<script src="features/calendar-badges.js" defer></script> 
    
<script src="app.js" defer></script>

<!-- 🧠 INIT -->
<script>
document.addEventListener("DOMContentLoaded", () => {
    try {
        window.AppState?.load();

        const user = localStorage.getItem("currentUser");
        UI?.text("currentUserName", user || "Användare");

        UI.get("btnAddVacation")?.addEventListener("click", () => openModal("vacationModal"));
        UI.get("btnLogout")?.addEventListener("click", logout);

        document.querySelectorAll("[data-action]").forEach(el => {
            el.addEventListener("click", () => {
                const map = {
                    employee: "employeeModal",
                    vacation: "vacationModal",
                    filter: "filterModal",
                    group: "groupModal"
                };
                openModal(map[el.dataset.action]);
            });
        });

        document.querySelectorAll("[data-close]").forEach(btn => {
            btn.addEventListener("click", () => closeModal(btn.dataset.close));
        });

        requestAnimationFrame(() => {
            initCalendar?.();
        });

    } catch (err) {
        console.error("Init error:", err);
    }
});
</script>

</body>
</html>
