<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semesterplaneraren</title>

    <!-- 📅 FullCalendar -->
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js" defer></script>

    <!-- 🎨 CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- 🧠 CORE -->
    <script src="utils/dom.js" defer></script>
    <script src="core/state.js" defer></script>
</head>

<body>

<!-- 🔐 LOGIN -->
<div id="loginScreen" style="display:none; padding:40px; text-align:center;">
    <h2>🔐 Logga in</h2>

    <input id="loginUser" placeholder="Username"><br><br>
    <input id="loginPass" type="password" placeholder="Password"><br><br>

    <button id="loginBtn">Logga in</button>
</div>

<!-- 🚀 APP -->
<div id="appRoot" style="display:none;">

<!-- 🔝 TOPBAR -->
<header class="topbar">
    <div class="topbar-left">
        📅 <span>Semesterplanerare</span>
    </div>

    <div class="topbar-center" id="calendarControls"></div>

    <div class="topbar-right">
        <button class="primary-btn" id="btnAddVacation">+ Ny semester</button>

        <div class="user-box">
            <span id="currentUserName">Användare</span>
        </div>

        <button class="logout-btn" id="btnLogout">Logga ut</button>
    </div>
</header>

<!-- 🎯 ACTIONS -->
<section class="actions">
    <div class="action-card" data-action="employee">👥 Lägg till personal</div>
    <div class="action-card" data-action="vacation">📅 Lägg till semester</div>
    <div class="action-card" data-action="filter">🔍 Filter</div>
    <div class="action-card" data-action="group">🧩 Skapa grupp</div>
</section>

<!-- 📅 KALENDER -->
<main>
    <div id="calendar"></div>
</main>

<!-- 📋 LISTA -->
<section class="card">
    <h3 id="vacationListTitle">📋 Semesterlista</h3>
    <div id="vacationSummary" class="muted-text"></div>
    <ul id="vacationList"></ul>
</section>

<!-- 🪟 MODAL OVERLAY -->
<div id="modalOverlay" class="modal-overlay"></div>

<!-- 👤 PERSONAL -->
<div id="employeeModal" class="modal">
    <div class="modal-content">
        <button class="close" data-close="employeeModal">×</button>
        <h3>Lägg till personal</h3>

        <p id="employeeWarning" class="warning"></p>

        <input type="text" id="employeeName" placeholder="Namn">
        <select id="employeeGroupSelect"></select>
        <input type="number" id="employeeVacationDays" placeholder="Semesterdagar">

        <button class="primary-btn" id="saveEmployeeBtn">Spara</button>

        <input type="text" id="employeeListSearch" placeholder="Sök personal..." autocomplete="off">
        <ul id="employeeList" class="list"></ul>
    </div>
</div>

<!-- ✏️ EDIT EMPLOYEE -->
<div id="editEmployeeModal" class="modal">
    <div class="modal-content">
        <button class="close" data-close="editEmployeeModal">×</button>
        <h3>Redigera personal</h3>

        <input type="hidden" id="editEmployeeId">

        <label>Namn</label>
        <input type="text" id="editEmployeeName">

        <label>Grupp</label>
        <select id="editEmployeeGroup"></select>

        <label>Semesterdagar</label>
        <input type="number" id="editEmployeeVacationDays">

        <div id="employeeBalanceBox" class="muted-text"></div>

        <button class="primary-btn" id="updateEmployeeBtn">Spara</button>
        <button class="logout-btn" id="deleteEmployeeBtn">Ta bort</button>
    </div>
</div>

<!-- 📅 VACATION -->
<div id="vacationModal" class="modal">
    <div class="modal-content">
        <button class="close" data-close="vacationModal">×</button>
        <h3>Lägg till semester</h3>

        <input type="text" id="employeeSearch" placeholder="Sök person...">
        <select id="employeeSelect"></select>

        <div id="vacationBalanceInfo"></div>

        <label>Start</label>
        <input type="date" id="startDate">

        <label>Slut</label>
        <input type="date" id="endDate">

        <button class="primary-btn" id="saveVacationBtn">Spara</button>
        <p id="warning"></p>
    </div>
</div>

</div> <!-- END appRoot -->

<!-- 📦 SCRIPTS -->
<script src="data.js" defer></script>
<script src="auth.js" defer></script>
<script src="ui.js" defer></script>
<script src="groups.js" defer></script>
<script src="employees.js" defer></script>
<script src="vacations.js" defer></script>

<script src="calendar/calendar-events.js" defer></script>
<script src="calendar/calendar-actions.js" defer></script>
<script src="calendar/calendar-init.js" defer></script>

<script src="features/filter-system.js" defer></script>
<script src="features/filter-ui.js" defer></script>
<script src="features/calendar-filter-hook.js" defer></script>
<script src="features/calendar-conflicts.js" defer></script>
<script src="features/calendar-badges.js" defer></script>
<script src="features/group-ui.js" defer></script>
<script src="features/employee-edit-ui.js" defer></script>

<script src="app.js" defer></script>

<!-- 🧠 INIT -->
<script>
document.addEventListener("DOMContentLoaded", () => {

    const loginScreen = document.getElementById("loginScreen");
    const app = document.getElementById("appRoot");

    const userId = localStorage.getItem("currentUser");

    // 🔐 LOGIN MODE
    if (!userId) {
        loginScreen.style.display = "block";
        app.style.display = "none";
    } else {
        loginScreen.style.display = "none";
        app.style.display = "block";

        const user = window.getCurrentUser?.();

        if (user && document.getElementById("currentUserName")) {
            document.getElementById("currentUserName").textContent = user.name || "Användare";
        }
    }

    // 🔑 LOGIN
    document.getElementById("loginBtn")?.addEventListener("click", () => {
        const u = document.getElementById("loginUser").value;
        const p = document.getElementById("loginPass").value;

        if (window.login?.(u, p)) {
            location.reload();
        }
    });

    // 🚪 LOGOUT
    document.getElementById("btnLogout")?.addEventListener("click", () => {
        window.logout?.();
    });

});
</script>

</body>
</html>
