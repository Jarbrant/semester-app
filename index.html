<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semesterplaneraren</title>

    <!-- 📅 FullCalendar -->
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>

    <!-- 🎨 CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- ========================================== -->
<!-- 🔝 TOPBAR (SaaS style) -->
<!-- ========================================== -->

<header class="topbar">

    <!-- vänster -->
    <div class="topbar-left">
        📅 <span>Semesterplanerare</span>
    </div>

    <!-- mitten (framtida controls) -->
    <div class="topbar-center" id="calendarControls"></div>

    <!-- höger -->
    <div class="topbar-right">

        <!-- ➕ Ny semester -->
        <button class="primary-btn" onclick="openModal('vacationModal')">
            + Ny semester
        </button>

        <!-- 👤 användare (nice-to-have dropdown senare) -->
        <div class="user-box">
            <span id="currentUserName">Användare</span>
        </div>

        <!-- 🚪 logout -->
        <button class="logout-btn" onclick="logout()">
            Logga ut
        </button>

    </div>

</header>

<!-- ========================================== -->
<!-- 🎯 ACTIONS -->
<!-- ========================================== -->

<section class="actions">

    <div class="action-card" onclick="openModal('employeeModal')">
        👥 Lägg till personal
    </div>

    <div class="action-card" onclick="openModal('vacationModal')">
        📅 Lägg till semester
    </div>

    <div class="action-card" onclick="openModal('filterModal')">
        🔍 Filter
    </div>

</section>

<!-- ========================================== -->
<!-- 📅 KALENDER (MAIN FOCUS) -->
<!-- ========================================== -->

<main>
    <div id="calendar"></div>
</main>

<!-- ========================================== -->
<!-- 📋 LISTA -->
<!-- ========================================== -->

<section class="card">
    <h3>📋 Semesterlista</h3>
    <ul id="vacationList"></ul>
</section>

<!-- ========================================== -->
<!-- 🪟 MODALS (FIXED + SAFE STRUCTURE) -->
<!-- ========================================== -->

<!-- overlay (important for z-index fix) -->
<div id="modalOverlay" class="modal-overlay" onclick="closeModal()"></div>

<!-- 👥 PERSONAL -->
<div id="employeeModal" class="modal">
    <div class="modal-content">

        <button class="close" onclick="closeModal()">×</button>

        <h3>Lägg till personal</h3>

        <input 
            type="text"
            id="employeeName"
            placeholder="Namn"
        >

        <button class="primary-btn" onclick="addEmployee(); closeModal();">
            Spara
        </button>

    </div>
</div>

<!-- 📅 SEMESTER -->
<div id="vacationModal" class="modal">
    <div class="modal-content">

        <button class="close" onclick="closeModal()">×</button>

        <h3>Lägg till semester</h3>

        <select id="employeeSelect"></select>

        <input type="date" id="startDate">
        <input type="date" id="endDate">

        <button class="primary-btn" onclick="addVacation(); closeModal();">
            Spara
        </button>

        <p id="warning"></p>

    </div>
</div>

<!-- 🔍 FILTER -->
<div id="filterModal" class="modal">
    <div class="modal-content">

        <button class="close" onclick="closeModal()">×</button>

        <h3>Filter</h3>

        <select id="filter" onchange="renderCalendar(); closeModal();">
            <option value="all">Visa alla</option>
        </select>

    </div>
</div>

<!-- ========================================== -->
<!-- 📦 SCRIPTS -->
<!-- ========================================== -->

<script src="data.js"></script>
<script src="auth.js"></script>
<script src="ui.js"></script>
<script src="employees.js"></script>
<script src="vacations.js"></script>
<script src="calendar.js"></script>
<script src="app.js"></script>

<!-- ========================================== -->
<!-- 🧠 NICE TO HAVE (AUTO INIT) -->
<!-- ========================================== -->

<script>
/* visar användarnamn i UI */
document.addEventListener("DOMContentLoaded", () => {
    const user = localStorage.getItem("currentUser");
    const el = document.getElementById("currentUserName");

    if (el && user) {
        el.innerText = user;
    }
});
</script>

</body>
</html>
