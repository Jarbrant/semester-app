<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Semesterplanerare</title>

  <!-- FullCalendar -->
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css" rel="stylesheet">

  <!-- Din CSS -->
  <link rel="stylesheet" href="styles.css" />
</head>

<body>

  <div class="app">

    <!-- SIDEBAR -->
    <aside class="sidebar">
      <h1 class="logo">🧠 Planner</h1>

      <nav class="nav">
        <button class="nav-item active">Kalender</button>
        <button class="nav-item">Personal</button>
      </nav>

      <div class="user-box">
        <span>Inloggad:</span>
        <strong id="user-name">-</strong>
      </div>
    </aside>

    <!-- MAIN -->
    <main class="main">

      <!-- HEADER -->
      <header class="header">
        <h2>Semesterplanering</h2>
      </header>

      <!-- GRID -->
      <div class="grid">

        <!-- PERSONAL -->
        <section class="card">
          <h3>Personal</h3>

          <div class="employee-form">
            <input id="emp-name" placeholder="Namn" />
            <input id="emp-phone" placeholder="Telefon" />
            <button id="add-employee" class="button">Lägg till</button>
          </div>

          <div id="employee-list"></div>
        </section>

        <!-- KALENDER -->
        <section class="card">
          <h3>Kalender</h3>
          <div id="calendar"></div>
        </section>

      </div>

    </main>

  </div>

  <!-- MODAL ROOT -->
  <div id="modal" class="modal"></div>

  <!-- SCRIPTS -->
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>

  <script type="module" src="./app.js"></script>

</body>
</html>
