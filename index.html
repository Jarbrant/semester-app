<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semesterplaneraren</title>

    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="topbar">
    <div>📅 Semesterplanerare</div>

    <button id="openVacationBtn">+ Ny semester</button>

    <div>
        <span id="currentUserName"></span>
        <button id="logoutBtn">Logga ut</button>
    </div>
</header>

<section class="actions">
    <div id="openEmployeeModal">👥 Lägg till personal</div>
    <div id="openVacationModal">📅 Lägg till semester</div>
    <div id="openFilterModal">🔍 Filter</div>
</section>

<main>
    <div id="calendar"></div>
</main>

<section>
    <h3>📋 Semesterlista</h3>
    <ul id="vacationList"></ul>
</section>

<!-- MODALS -->
<div id="modalOverlay" class="modal-overlay"></div>

<div id="employeeModal" class="modal">
    <div class="modal-content">
        <button data-close>×</button>
        <h3>Lägg till personal</h3>
        <p id="employeeWarning"></p>
        <input type="text" id="employeeName">
        <button id="saveEmployeeBtn">Spara</button>
    </div>
</div>

<div id="vacationModal" class="modal">
    <div class="modal-content">
        <button data-close>×</button>
        <h3>Lägg till semester</h3>

        <select id="employeeSelect"></select>

        <input type="date" id="startDate">
        <input type="date" id="endDate">

        <button id="saveVacationBtn">Spara</button>
        <p id="warning"></p>
    </div>
</div>

<div id="filterModal" class="modal">
    <div class="modal-content">
        <button data-close>×</button>
        <h3>Filter</h3>
        <select id="filter"></select>
    </div>
</div>

<!-- SCRIPTS -->
<script src="data.js"></script>
<script src="auth.js"></script>
<script src="ui.js"></script>
<script src="employees.js"></script>
<script src="vacations.js"></script>
<script src="calendar/calendar-events.js"></script>
<script src="calendar/calendar-init.js"></script>
<script src="app.js"></script>

<!-- INIT -->
<script>
document.addEventListener("DOMContentLoaded", () => {

    const user = localStorage.getItem("currentUser");
    if (user) {
        document.getElementById("currentUserName").innerText = user;
    }

    document.getElementById("openVacationBtn").onclick = () => openModal("vacationModal");
    document.getElementById("openEmployeeModal").onclick = () => openModal("employeeModal");
    document.getElementById("openVacationModal").onclick = () => openModal("vacationModal");
    document.getElementById("openFilterModal").onclick = () => openModal("filterModal");

    document.querySelectorAll("[data-close]").forEach(btn =>
        btn.onclick = closeModal
    );

    document.getElementById("saveEmployeeBtn").onclick = tryAddEmployee;
    document.getElementById("saveVacationBtn").onclick = trySubmitVacation;

    document.getElementById("logoutBtn").onclick = logout;

});
</script>

</body>
</html>
